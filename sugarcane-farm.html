<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugarcane Farm Profile</title>
    <style>
        body {
            background-color: #f4f7f6;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #e8f5e9;
            padding: 20px;
            border-bottom: 3px solid #2e7d32;
            text-align: center;
        }
        
        nav a {
            margin: 0 15px;
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        .dashboard-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .report-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border-top: 6px solid #2e7d32;
            padding: 30px;
        }
        
        .report-card h2 {
            color: #1b5e20;
            margin-top: 0;
            border-bottom: 2px solid #e8f5e9;
            padding-bottom: 10px;
            text-align: center;
        }
        
        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 16px;
            color: #333;
        }
        
        .status-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <header>
        <h1 style="color: #1b5e20; margin: 0 0 10px 0;">Smart Irrigation System</h1>
        <nav>

            <a href="registration.html">Register</a>
        </nav>
    </header>

    <div class="dashboard-container">
        <script src="sugarcane-farm.js"></script>
    </div>

</body>
</html>
