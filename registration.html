<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Farmer Registration</title>
    
    <link rel="stylesheet" href="form.css">
    
    <style>
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        input[type="number"],
        input[type="date"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box; 
            transition: border-color 0.3s;
        }

        input[type="number"]:focus,
        input[type="date"]:focus,
        input[type="file"]:focus {
            border-color: #2e7d32;
            outline: none;
            box-shadow: 0 0 5px rgba(46, 125, 50, 0.3);
        }

        input[type="reset"] {
            width: 100%;
            background-color: #757575;
            color: white;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        input[type="reset"]:hover {
            background-color: #616161;
        }

        .error-msg {
            color: #d32f2f;
            font-size: 13px;
            font-weight: bold;
            display: block;
            margin-top: -3px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header style="text-align: center; margin-bottom: 20px;">
        <nav>
            <a href="index.html" style="margin: 0 10px; color: #2e7d32; text-decoration: none; font-weight: bold;">Home</a>
            <a href="dashboard.html" style="margin: 0 10px; color: #2e7d32; text-decoration: none; font-weight: bold;">Dashboard</a>
        </nav>
    </header>

    <main>
        <form id="farmerRegistrationForm" action="#" method="post">
            <fieldset>
                <legend>Farmer & Plot Registration</legend>
                
                <!-- 1. Farmer Name -->
                <label for="farmerName">Farmer Name:</label>
                <input type="text" id="farmerName" name="farmerName" placeholder="Enter full name">
                <span class="error-msg" id="nameError"></span>

                <!-- 2. Mobile Number -->
                <label for="mobileNumber">Mobile Number:</label>
                <input type="tel" id="mobileNumber" name="mobileNumber" placeholder="10-digit mobile number">
                <span class="error-msg" id="mobileError"></span>

                <!-- 3. Email -->
                <label for="emailAddress">Email Address:</label>
                <input type="text" id="emailAddress" name="emailAddress" placeholder="example@farm.com">
                <span class="error-msg" id="emailError"></span>

                <!-- 4. Plot ID -->
                <label for="plotId">Plot ID:</label>
                <input type="text" id="plotId" name="plotId" placeholder="e.g., PLOT-1234">
                <span class="error-msg" id="plotError"></span>

                <!-- 5. Village -->
                <label for="village">Village:</label>
                <input type="text" id="village" name="village" placeholder="Enter village name">
                <span class="error-msg" id="villageError"></span>

                <!-- 6. Crop Stage -->
                <label for="cropStage">Crop Stage:</label>
                <select id="cropStage" name="cropStage">
                    <option value="">-- Select Stage --</option>
                    <option value="seedling">Seedling</option>
                    <option value="vegetative">Vegetative</option>
                    <option value="flowering">Flowering</option>
                    <option value="harvesting">Harvesting</option>
                </select>

                <!-- 7. Soil Type -->
                <label for="soilType">Soil Type:</label>
                <select id="soilType" name="soilType">
                    <option value="">-- Select Soil Type --</option>
                    <option value="clay">Clay</option>
                    <option value="loam">Loam</option>
                    <option value="sandy">Sandy</option>
                    <option value="silt">Silt</option>
                </select>

                <!-- 8. Irrigation Method -->
                <label for="irrigationMethod">Irrigation Method:</label>
                <select id="irrigationMethod" name="irrigationMethod">
                    <option value="">-- Select Method --</option>
                    <option value="drip">Drip Irrigation</option>
                    <option value="sprinkler">Sprinkler System</option>
                    <option value="surface">Surface/Flood</option>
                    <option value="manual">Manual Watering</option>
                </select>

                <!-- 9. Soil Moisture (%) -->
                <label for="soilMoisture">Soil Moisture (%):</label>
                <input type="number" id="soilMoisture" name="soilMoisture" min="0" max="100" placeholder="e.g., 45">

                <!-- 10. Registration Date -->
                <label for="registrationDate">Registration Date:</label>
                <input type="date" id="registrationDate" name="registrationDate">

                <!-- 11. Farm Photo -->
                <label for="farmPhoto">Upload Farm Photo:</label>
                <input type="file" id="farmPhoto" name="farmPhoto" accept="image/*">

                <input type="submit" value="Register Plot">
                <input type="reset" value="Clear Form">
            </fieldset>
        </form>
    </main>

    <script>
        document.getElementById('farmerRegistrationForm').addEventListener('submit', function(event) {
            let isValid = true;

            // Retrieve and trim values
            const farmerName = document.getElementById('farmerName').value.trim();
            const mobileNumber = document.getElementById('mobileNumber').value.trim();
            const emailAddress = document.getElementById('emailAddress').value.trim();
            const plotId = document.getElementById('plotId').value.trim();
            const village = document.getElementById('village').value.trim();

            // Retrieve error message spans
            const nameError = document.getElementById('nameError');
            const mobileError = document.getElementById('mobileError');
            const emailError = document.getElementById('emailError');
            const plotError = document.getElementById('plotError');
            const villageError = document.getElementById('villageError');

            // Reset error messages on each submit attempt
            nameError.textContent = '';
            mobileError.textContent = '';
            emailError.textContent = '';
            plotError.textContent = '';
            villageError.textContent = '';

            // Task 2: Validate Farmer Name (Not empty, letters and spaces only)
            const nameRegex = /^[A-Za-z\s]+$/;
            if (farmerName === '') {
                nameError.textContent = 'Farmer Name is required.';
                isValid = false;
            } else if (!nameRegex.test(farmerName)) {
                nameError.textContent = 'Farmer Name can only contain letters and spaces.';
                isValid = false;
            }

            // Task 3: Validate Mobile Number (10 digits, starts with 6-9 for India)
            const mobileRegex = /^[6-9]\d{9}$/;
            if (mobileNumber === '') {
                mobileError.textContent = 'Mobile Number is required.';
                isValid = false;
            } else if (!mobileRegex.test(mobileNumber)) {
                mobileError.textContent = 'Enter a valid 10-digit Indian mobile number (starting with 6-9).';
                isValid = false;
            }

            // Task 3: Validate Email Address
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailAddress === '') {
                emailError.textContent = 'Email Address is required.';
                isValid = false;
            } else if (!emailRegex.test(emailAddress)) {
                emailError.textContent = 'Enter a valid email format (e.g., farmer@domain.com).';
                isValid = false;
            }

            // Task 2: Validate Plot ID (Not empty)
            if (plotId === '') {
                plotError.textContent = 'Plot ID is required.';
                isValid = false;
            }

            // Task 2: Validate Village (Not empty)
            if (village === '') {
                villageError.textContent = 'Village is required.';
                isValid = false;
            }

            // Prevent form submission if any validation fails
            if (!isValid) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
