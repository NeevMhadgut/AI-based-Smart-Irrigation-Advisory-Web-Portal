<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration - Smart Irrigation</title>
    
    <!-- Linking the external form.css file -->
    <link rel="stylesheet" href="form.css">
    
    <style>
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header style="text-align: center; margin-bottom: 20px;">
        <nav>
            <a href="index.html" style="margin: 0 10px; color: #2e7d32; text-decoration: none; font-weight: bold;">Home</a>
            <a href="gallery.html" style="margin: 0 10px; color: #2e7d32; text-decoration: none; font-weight: bold;">Gallery</a>
            <a href="irrigation-table.html" style="margin: 0 10px; color: #2e7d32; text-decoration: none; font-weight: bold;">Price List</a>
        </nav>
    </header>

    <main>
        <form action="#" method="post">
            <fieldset>
                <legend>Portal Registration</legend>
                
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="example@farm.com" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 234 567 8900" required>

                <label for="region">Farm Region:</label>
                <select id="region" name="region">
                    <option value="north">North Sector</option>
                    <option value="south">South Sector</option>
                    <option value="east">East Sector</option>
                    <option value="west">West Sector</option>
                </select>

                <input type="submit" value="Register Now">
            </fieldset>
        </form>
    </main>

</body>
</html>
